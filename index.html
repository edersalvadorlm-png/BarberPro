<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR. BARBER | Reserva tu cita</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HOME -->

<section id="screen-home" class="screen active">

<div class="hero">

<div class="hero-content">

<div class="logo">💈</div>

<h1>MR. BARBER</h1>

<p class="subtitle">
Estilo, precisión y confianza
</p>

<div class="rating">
⭐ 4.7 | Santa Catarina NL
</div>

<div class="address">
📍 Manuel Ordóñez 521<br>
Villas de las Huertas<br>
Santa Catarina, N.L. 66362
</div>

<button id="btn-start" class="btn-primary">
Reservar cita
</button>

</div>

</div>

</section>

<!-- CLIENTE -->

<section id="screen-client" class="screen">

<div class="container">

<h2>Datos del Cliente</h2>

<div class="field">
<label>Nombre completo</label>
<input type="text" id="client-name">
</div>

<div class="field">
<label>WhatsApp</label>
<input type="tel" id="client-phone">
</div>

<button id="btn-client" class="btn-primary">
Continuar
</button>

</div>

</section>

<!-- SERVICIOS -->

<section id="screen-service" class="screen">

<div class="container">

<h2>Selecciona tu servicio</h2>

<div class="services-grid">

<div class="service-card"
data-service="Corte"
data-price="200">

<div class="icon">💈</div>

<h3>Corte</h3>

<p>$200</p>

</div>

<div class="service-card"
data-service="Barba"
data-price="100">

<div class="icon">🪒</div>

<h3>Barba</h3>

<p>$100</p>

</div>

<div class="service-card"
data-service="Ceja"
data-price="50">

<div class="icon">👁️</div>

<h3>Ceja</h3>

<p>$50</p>

</div>

<div class="service-card"
data-service="Corte + Barba"
data-price="250">

<div class="icon">✨</div>

<h3>Corte + Barba</h3>

<p>$250</p>

</div>

</div>

<button id="btn-service" class="btn-primary">
Elegir Barbero
</button>

</div>

</section>
