<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR. BARBER | Reserva tu cita</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<section id="screen-home" class="screen active">

<div class="hero">

<div class="overlay"></div>

<div class="hero-content">

<div class="logo">💈</div>

<h1>MR. BARBER</h1>

<p class="subtitle">
Estilo, precisión y confianza
</p>

<div class="rating">
⭐ 4.7 | Santa Catarina NL
</div>

<div class="address">
📍 Manuel Ordóñez 521<br>
Villas de las Huertas<br>
Santa Catarina, N.L. 66362
</div>

<button id="btn-start" class="btn-primary">
Reservar Cita
</button>

</div>

</div>

</section>

<section id="screen-client" class="screen">

<div class="container">

<h2>Datos del Cliente</h2>

<div class="field">
<label>Nombre completo</label>
<input type="text" id="client-name" placeholder="Ingresa tu nombre">
</div>

<div class="field">
<label>WhatsApp</label>
<input type="tel" id="client-phone" placeholder="81 1234 5678">
</div>

<button id="btn-client" class="btn-primary">
Continuar
</button>

</div>

</section>

<script src="js/app.js"></script>

</body>
</html>
